server {
  listen 80;
  listen [::]:80;
  server_name csvdash.com;

  root /var/www/csv-dashboard/latest;
  index index.html;

  access_log /var/log/nginx/csv-dashboard.access.log;
  error_log /var/log/nginx/csv-dashboard.error.log;

  # Basic hardening headers for a static single-page app.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  # Cache immutable assets aggressively, but not HTML.
  location = /index.html {
    add_header Cache-Control "no-store" always;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Do not serve hidden files.
  location ~ /\. {
    deny all;
  }
}
